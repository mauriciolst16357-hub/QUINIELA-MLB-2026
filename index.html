<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiniela MLB Playoffs 2026</title>

<style>

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #06152f, #0b2d5c);
    color: white;
    text-align: center;
    min-height: 100vh;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitulo {
    font-size: 18px;
    margin-bottom: 20px;
}

.info {
    background: rgba(255,255,255,0.12);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 20px;
}

.info strong {
    display: block;
    font-size: 20px;
    margin: 5px;
}

input {
    width: 90%;
    max-width: 400px;
    padding: 15px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    margin-bottom: 20px;
    box-sizing: border-box;
}

h2 {
    margin-top: 15px;
}

#casillas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
}

.casilla {
    background: white;
    color: #06214b;
    border: none;
    border-radius: 15px;
    padding: 25px 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
}

.casilla:hover {
    transform: scale(1.03);
}

.casilla:disabled {
    cursor: not-allowed;
}

.casilla.ocupada {
    background: #777;
    color: white;
}

#resultado {
    display: none;
    margin-top: 30px;
    background: white;
    color: #06214b;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

#equipo {
    font-size: 28px;
    font-weight: bold;
    margin: 15px 0;
}

#participante,
#numeroCasilla {
    font-size: 18px;
    margin: 8px;
}

.nota {
    margin-top: 25px;
    font-size: 14px;
    opacity: 0.8;
}

@media (max-width: 450px) {

    h1 {
        font-size: 26px;
    }

    #casillas {
        gap: 10px;
    }

    .casilla {
        padding: 22px 5px;
        font-size: 16px;
    }

}

</style>
</head>

<body>

<div class="contenedor">

    <h1>⚾ QUINIELA MLB 2026 🏆</h1>

    <div class="subtitulo">
        Selecciona una casilla y descubre tu equipo
    </div>

    <div class="info">
        <strong>💰 Entrada: $500 MXN</strong>
        <strong>👥 8 Participantes</strong>
        <strong>🏆 Premio: $4,000 MXN</strong>
    </div>

    <h2>👤 Escribe tu nombre</h2>

    <input
        type="text"
        id="nombre"
        placeholder="Nombre del participante"
    >

    <h2>🎟️ Elige una casilla</h2>

    <div id="casillas"></div>

    <div id="resultado">

        <div id="participante"></div>

        <div id="numeroCasilla"></div>

        <div id="equipo"></div>

        <div style="font-size:18px;">
            ¡Esta es tu selección! 🎉
        </div>

    </div>

    <div class="nota">
        Cada casilla recibe un equipo diferente.
    </div>

</div>

<script>

const equipos = [
    "Los Angeles Dodgers",
    "Milwaukee Brewers",
    "Cleveland Guardians",
    "Tampa Bay Rays",
    "New York Yankees",
    "Chicago White Sox",
    "San Diego Padres",
    "Atlanta Braves"
];

let equiposDisponibles = [...equipos];

const casillas = document.getElementById("casillas");
const nombre = document.getElementById("nombre");
const resultado = document.getElementById("resultado");
const equipo = document.getElementById("equipo");
const participante = document.getElementById("participante");
const numeroCasilla = document.getElementById("numeroCasilla");

for (let i = 1; i <= 8; i++) {

    const boton = document.createElement("button");

    boton.className = "casilla";

    boton.innerHTML = "🔒<br>CASILLA " + i;

    boton.onclick = function () {

        const nombreParticipante = nombre.value.trim();

        if (nombreParticipante === "") {

            alert("Primero escribe tu nombre.");

            nombre.focus();

            return;
        }

        if (equiposDisponibles.length === 0) {

            alert("Todos los equipos ya fueron asignados.");

            return;
        }

        const posicion = Math.floor(
            Math.random() * equiposDisponibles.length
        );

        const equipoAsignado =
            equiposDisponibles.splice(posicion, 1)[0];

        boton.classList.add("ocupada");

        boton.disabled = true;

        boton.innerHTML =
            "🔒<br>OCUPADA";

        equipo.textContent =
            "⚾ " + equipoAsignado;

        participante.textContent =
            "👤 Participante: " + nombreParticipante;

        numeroCasilla.textContent =
            "🎟️ Casilla: " + i;

        resultado.style.display = "block";

        nombre.value = "";

        if (equiposDisponibles.length === 0) {

            setTimeout(function () {

                alert("🏆 Las 8 casillas ya fueron asignadas.");

            }, 300);

        }

    };

    casillas.appendChild(boton);
}

</script>

</body>
</html>
